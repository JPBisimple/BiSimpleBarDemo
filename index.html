// ============================================================================
const COMMON_CURRENCIES = [
  ['DKK','Danish krone'], ['EUR','Euro'], ['CHF','Swiss franc'],
  ['GBP','British pound'], ['USD','US dollar'], ['SEK','Swedish krona'],
  ['NOK','Norwegian krone'], ['JPY','Japanese yen'],
];
const COMMON_LOCALES = [
  ['en-GB','English (UK) — 1,234.56'],
  ['en-US','English (US) — 1,234.56'],
  ['da-DK','Danish — 1.234,56'],
  ['de-CH','German (Switzerland) — 1’234.56'],
  ['de-DE','German (Germany) — 1.234,56'],
  ['fr-FR','French — 1 234,56'],
  ['es-ES','Spanish — 1.234,56'],
  ['it-IT','Italian — 1.234,56'],
  ['nl-NL','Dutch — 1.234,56'],
];

async function openTenantSettings() {
  const t = currentTenant();
  if (!t) return;
  const form = el('div');

  // Name (read-only — vi vil ikke have admins ændre tenant-name uden videre)
  form.appendChild(el('div',{class:'field'},
    el('label',{}, 'Tenant'),
    el('div',{style:{padding:'10px 12px',background:'rgba(26,26,26,.04)',borderRadius:'8px',fontWeight:600}},
      `${t.name} · ${t.city || ''}`),
  ));

  // Currency
  const curSel = el('select',{class:'input'});
  COMMON_CURRENCIES.forEach(([code,label]) => {
    const o = el('option',{value:code}, `${code} — ${label}`);
    if (code === (t.currency || 'DKK')) o.selected = true;
    curSel.appendChild(o);
  });
  form.appendChild(el('div',{class:'field'}, el('label',{},'Currency'), curSel));

  // Locale
  const locSel = el('select',{class:'input'});
  COMMON_LOCALES.forEach(([code,label]) => {
    const o = el('option',{value:code}, label);
    if (code === (t.locale || 'da-DK')) o.selected = true;
    locSel.appendChild(o);
  });
  form.appendChild(el('div',{class:'field'},
    el('label',{},'Number / date format'),
    locSel,
    el('div',{style:{fontSize:'12px',color:'var(--ink-mute)',marginTop:'6px'}},
      'Affects how numbers, dates and currency symbols are displayed.'),
  ));

  // Preview
  const preview = el('div',{style:{padding:'12px',background:'rgba(138,21,56,.04)',border:'1px solid var(--line)',borderRadius:'8px',fontSize:'13px',marginTop:'12px'}});
  const updatePreview = () => {
    const cur = curSel.value, loc = locSel.value;
    try {
      const fmt = new Intl.NumberFormat(loc, {style:'currency', currency:cur, maximumFractionDigits:2});
      preview.textContent = `Preview: ${fmt.format(1234.5)} · ${(1234.567).toLocaleString(loc,{maximumFractionDigits:2})}`;
    } catch(e) {
      preview.textContent = 'Invalid combination: ' + e.message;
    }
  };
  curSel.addEventListener('change', updatePreview);
  locSel.addEventListener('change', updatePreview);
  updatePreview();
  form.appendChild(preview);

  await modal('Tenant settings', form, async () => {
    const payload = { currency: curSel.value, locale: locSel.value };
    const { error } = await state.sb.from('tenants').update(payload).eq('id', t.id);
    if (error) return toast(error.message, 'bad');
    t.currency = payload.currency;
    t.locale = payload.locale;
    toast('Settings saved','ok');
    renderApp();
    return true;
  });
}

// COCKTAIL EDITOR (admin)
// ============================================================================
// Lille inline-formular til at oprette en ingrediens uden at forlade editoren.
// Kan ikke være en modal: modal() lukker den underliggende editor og
// brugerens ikke-gemte arbejde ville gå tabt.
function inlineIngredientCreator(onCreated) {
  const wrap = el('div',{style:{marginTop:'6px'}});
  const f = { name:'', category:'', purchase_size:null, purchase_unit:'ml', purchase_price:null };

  const panel = el('div',{style:{display:'none',marginTop:'8px',padding:'10px',
    border:'1px solid var(--line)',borderRadius:'6px',background:'var(--paper,transparent)'}});

  const inp = (ph, key, type='text', w='100%') => el('input',{
    class:'input', placeholder:ph, type, style:{minHeight:'36px',fontSize:'13px',width:w},
    oninput: e => f[key] = type==='number' ? (e.target.value===''?null:Number(e.target.value)) : e.target.value });

  const nameI = inp('Ingredient name *','name');
  const catI  = inp('Category','category');
  const sizeI = inp('Purchase size *','purchase_size','number');
  const unitI = inp('Unit *','purchase_unit');
  unitI.value = f.purchase_unit;
  const priceI = inp('Purchase price *','purchase_price','number');

  panel.appendChild(el('div',{class:'field'}, nameI));
  panel.appendChild(el('div',{class:'field'}, catI));
  panel.appendChild(el('div',{style:{display:'flex',gap:'6px'}},
    el('div',{style:{flex:1}}, sizeI),
    el('div',{style:{width:'80px'}}, unitI),
    el('div',{style:{flex:1}}, priceI),
  ));
  panel.appendChild(el('div',{class:'sb',style:{marginTop:'6px'}},
    'Size and price are what you pay for one purchase unit — e.g. 700 ml for 189.'));

  const createBtn = el('button',{class:'btn sm',style:{marginTop:'8px'},onclick:async()=>{
    if (!f.name.trim()) return toast('Ingredient name required','bad');
    if (!f.purchase_size || !f.purchase_unit || f.purchase_price == null)
      return toast('Size, unit and price are required — otherwise cost cannot be calculated','bad');
    createBtn.disabled = true;
    const payload = {
      tenant_id: state.activeTenantId,
      name: f.name.trim(),
      category: f.category.trim() || null,
      purchase_size: f.purchase_size,
      purchase_unit: f.purchase_unit.trim(),
      purchase_price: f.purchase_price,
    };
    const { data, error } = await state.sb.from('ingredients').insert(payload).select().single();
    createBtn.disabled = false;
    if (error) {
      return toast(error.message.includes('duplicate')
        ? 'An ingredient with that name already exists' : error.message, 'bad');
    }
    state.data.ingredients.push(data);
    state.data.ingredients.sort((a,b) =>
      (a.category||'').localeCompare(b.category||'') || (a.name||'').localeCompare(b.name||''));
    toast('Ingredient created','ok');
    // Nulstil og luk panelet
    f.name=''; f.category=''; f.purchase_size=null; f.purchase_price=null;
    nameI.value=''; catI.value=''; sizeI.value=''; priceI.value='';
    panel.style.display = 'none';
    onCreated(data);
  }},'Create ingredient');

  panel.appendChild(el('div',{class:'btn-row'},
    createBtn,
    el('button',{class:'btn ghost sm',style:{marginTop:'8px'},
      onclick:()=>{ panel.style.display='none'; }},'Cancel'),
  ));

  wrap.appendChild(el('button',{class:'btn ghost sm',
    onclick:()=>{ panel.style.display = panel.style.display==='none' ? 'block' : 'none';
                  if (panel.style.display==='block') nameI.focus(); }},
    '+ New ingredient'));
  wrap.appendChild(panel);
  return wrap;
}

async function openCocktailEditor(cocktail, eventId = null) {
  const isNew = !cocktail;
  const evId = cocktail ? (cocktail.event_id || null) : (eventId || null);
  const f = cocktail ? { ...cocktail } : {
    name:'', menu_wording:'', flavour_profile:'', allergens:'',
    glassware:'', ice:'', garnish:'', tools:'', procedure:'',
    alcohol_percent:'', sell_price:'', is_active: true,
  };

  // Component rows: {type:'ingredient'|'prep', id, quantity, unit}
  let compRows = [];
  if (!isNew) {
    compRows = state.data.cocktail_components
      .filter(c => c.cocktail_id === cocktail.id)
      .map(c => ({
        type: c.ingredient_id ? 'ingredient' : 'prep',
        id: c.ingredient_id || c.prep_id,
        quantity: c.quantity,
        unit: c.unit,
        _db_id: c.id,
      }));
  }

  const form = el('div');

  // Basic fields
  function fld(label, key, type='text', extra={}) {
    const inp = el(type==='textarea' ? 'textarea' : 'input',
      Object.assign({ class:'input', value: f[key] ?? '', ...(type!=='textarea'?{type}:{}),
        oninput: e => f[key] = type==='number' ? (e.target.value===''?null:Number(e.target.value)) : e.target.value
      }, extra));
    form.appendChild(el('div',{class:'field'}, el('label',{},label), inp));
  }
  fld('Name','name');
  fld('Menu wording','menu_wording');
  fld('Flavour profile','flavour_profile','textarea');
  fld('Allergens','allergens','textarea');
  fld('Glassware','glassware');
  fld('Ice','ice');
  fld('Garnish','garnish');
  fld('Tools','tools');
  fld('Procedure','procedure','textarea');
  fld('ABV %','alcohol_percent','number');
  fld('Sell price','sell_price','number');

  // Active toggle
  const activeChk = el('input',{type:'checkbox', style:{marginRight:'6px'}});
  activeChk.checked = f.is_active !== false;
  activeChk.addEventListener('change', () => f.is_active = activeChk.checked);
  form.appendChild(el('div',{class:'field'},
    el('label',{style:{display:'flex',alignItems:'center',gap:'6px',cursor:'pointer'}},
      activeChk, 'Active'),
  ));

  // -- Menus section --
  const menuIds = new Set(isNew ? [] : menuIdsForCocktail(cocktail.id));
  if (state.data.menus.length > 0 && !evId) {
    const menuSection = el('div',{style:{marginTop:'16px',borderTop:'1px solid var(--line)',paddingTop:'12px'}});
    menuSection.appendChild(el('div',{style:{fontSize:'11px',textTransform:'uppercase',letterSpacing:'.08em',color:'var(--ink-mute)',fontWeight:600,marginBottom:'10px'}}, 'On menus'));

    const addChk = (m, box) => {
      const chk = el('input',{type:'checkbox',style:{marginRight:'6px'}});
      chk.checked = menuIds.has(m.id);
      chk.addEventListener('change', () => chk.checked ? menuIds.add(m.id) : menuIds.delete(m.id));
      box.appendChild(el('label',{style:{display:'flex',alignItems:'center',gap:'4px',cursor:'pointer',padding:'3px 0',fontSize:'13px'}},
        chk, m.name + (m.is_active === false ? ' (inactive)' : '')));
    };

    ungroupedMenus().forEach(m => addChk(m, menuSection));
    groupsWithMenus().forEach(g => {
      menuSection.appendChild(el('div',{style:{fontSize:'12px',fontWeight:600,marginTop:'8px',color:'var(--ink-soft)'}}, g.name));
      const box = el('div',{style:{paddingLeft:'10px'}});
      menusInGroup(g.id).forEach(m => addChk(m, box));
      menuSection.appendChild(box);
    });
    form.appendChild(menuSection);
  }

  // -- Components section --
  const compSection = el('div',{style:{marginTop:'16px',borderTop:'1px solid var(--line)',paddingTop:'12px'}});
  compSection.appendChild(el('div',{style:{fontSize:'11px',textTransform:'uppercase',letterSpacing:'.08em',color:'var(--ink-mute)',fontWeight:600,marginBottom:'10px'}}, 'Recipe components'));

  const compList = el('div');
  compSection.appendChild(compList);

  function renderCompRows() {
    compList.innerHTML = '';
    compRows.forEach((row, idx) => {
      const typeSel = el('select',{class:'input',style:{minWidth:'110px',padding:'8px 6px',minHeight:'38px',fontSize:'13px'}});
      ['ingredient','prep'].forEach(t => {
        const o = el('option',{value:t}, t==='ingredient'?'Ingredient':'Prep');
        if (t === row.type) o.selected = true;
        typeSel.appendChild(o);
      });

      const idSel = el('select',{class:'input',style:{flex:1,padding:'8px 6px',minHeight:'38px',fontSize:'13px'}});
      function populateIdSel(type) {
        idSel.innerHTML = '';
        const items = type === 'ingredient' ? state.data.ingredients
          : (evId ? prepsForEvent(evId) : normalPreps());
        items.forEach(it => {
          const o = el('option',{value:it.id}, it.name);
          if (it.id === row.id) o.selected = true;
          idSel.appendChild(o);
        });
        if (!row.id && items.length) row.id = items[0].id;
      }
      populateIdSel(row.type);

      typeSel.addEventListener('change', () => {
        row.type = typeSel.value;
        row.id = null;
        populateIdSel(row.type);
      });
      idSel.addEventListener('change', () => row.id = idSel.value);

      const qtyInp = el('input',{class:'input',type:'number',min:'0',step:'0.1',
        value:String(row.quantity||''), placeholder:'Qty',
        style:{width:'72px',padding:'8px 6px',minHeight:'38px',fontSize:'13px'},
        oninput:e=>row.quantity=e.target.value===''?null:Number(e.target.value)});

      const unitInp = el('input',{class:'input',type:'text',
        value:row.unit||'', placeholder:'ml',
        style:{width:'56px',padding:'8px 6px',minHeight:'38px',fontSize:'13px'},
        oninput:e=>row.unit=e.target.value});

      const delBtn = el('button',{class:'btn ghost sm danger',style:{minHeight:'38px'},
        onclick:()=>{ compRows.splice(idx,1); renderCompRows(); }}, '✕');

      compList.appendChild(el('div',{style:{display:'flex',gap:'6px',alignItems:'center',marginBottom:'6px',flexWrap:'wrap'}},
        typeSel, idSel, qtyInp, unitInp, delBtn,
      ));
    });
  }
  renderCompRows();

  compSection.appendChild(el('button',{class:'btn ghost sm',style:{marginTop:'4px'},
    onclick:()=>{ compRows.push({type:'ingredient',id:state.data.ingredients[0]?.id||null,quantity:null,unit:'ml'}); renderCompRows(); }},
    '+ Add component'));
  compSection.appendChild(inlineIngredientCreator(ing => {
    compRows.push({ type:'ingredient', id: ing.id, quantity:null, unit: ing.purchase_unit || 'ml' });
    renderCompRows();
  }));
  form.appendChild(compSection);

  await modal(isNew ? 'New cocktail' : 'Edit: ' + cocktail.name, form, async () => {
    if (!f.name) return toast('Name required','bad');

    const payload = {
      tenant_id: state.activeTenantId,
      name: f.name, menu_wording: f.menu_wording||null,
      flavour_profile: f.flavour_profile||null, allergens: f.allergens||null,
      glassware: f.glassware||null, ice: f.ice||null, garnish: f.garnish||null,
      tools: f.tools||null, procedure: f.procedure||null,
      alcohol_percent: f.alcohol_percent||null, sell_price: f.sell_price||null,
      is_active: f.is_active, event_id: evId,
    };

    let cocktailId;
    if (isNew) {
      const { data, error } = await state.sb.from('cocktails').insert(payload).select().single();
      if (error) return toast(error.message,'bad');
      state.data.cocktails.push(data);
      cocktailId = data.id;
      if (evId) {
        const n = state.data.event_cocktails.filter(x => x.event_id === evId).length;
        const { data: ecd, error: ee } = await state.sb.from('event_cocktails')
          .insert({ tenant_id: state.activeTenantId, event_id: evId, cocktail_id: data.id, quantity: 0, sort_order: n })
          .select().single();
        if (ee) toast(ee.message,'bad'); else state.data.event_cocktails.push(ecd);
      }
    } else {
      const { error } = await state.sb.from('cocktails').update(payload).eq('id', cocktail.id);
      if (error) return toast(error.message,'bad');
      Object.assign(cocktail, payload);
      cocktailId = cocktail.id;
      // Delete existing components
      await state.sb.from('cocktail_components').delete().eq('cocktail_id', cocktailId);
      state.data.cocktail_components = state.data.cocktail_components.filter(c => c.cocktail_id !== cocktailId);
    }

    // Insert components
    for (const row of compRows) {
      if (!row.id || !row.quantity || !row.unit) continue;
      const cp = {
        cocktail_id: cocktailId,
        tenant_id: state.activeTenantId,
        quantity: row.quantity,
        unit: row.unit,
        ingredient_id: row.type === 'ingredient' ? row.id : null,
        prep_id: row.type === 'prep' ? row.id : null,
      };
      const { data: cd, error: ce } = await state.sb.from('cocktail_components').insert(cp).select().single();
      if (ce) toast('Component error: ' + ce.message,'bad');
      else state.data.cocktail_components.push(cd);
    }

    // Menu-tilknytninger: slet og genskab
    await state.sb.from('menu_cocktails').delete().eq('cocktail_id', cocktailId);
    state.data.menu_cocktails = state.data.menu_cocktails.filter(mc => mc.cocktail_id !== cocktailId);
    for (const mid of menuIds) {
      const { data: md, error: me } = await state.sb.from('menu_cocktails')
        .insert({ tenant_id: state.activeTenantId, menu_id: mid, cocktail_id: cocktailId, sort_order: 0 })
        .select().single();
      if (me) toast('Menu error: ' + me.message,'bad');
      else state.data.menu_cocktails.push(md);
    }

    toast('Saved','ok');
    renderRoute();
    return true;
  });
}

let _currentModal = null;
async function modal(title, body, onConfirm, onClose) {
  return new Promise(resolve => {
    closeModal();
    const bg = el('div',{class:'modal-bg', onclick:e=>{ if (e.target === bg) close(); }});
    const m = el('div',{class:'modal'});
    const close = (val) => {
      if (onClose) onClose();
      bg.remove();
      _currentModal = null;
      resolve(val);
    };
    m.appendChild(el('div',{class:'modal-hd'},
      el('h3',{},title),
      el('button',{class:'icon-btn',style:{color:'var(--ink)'},onclick:()=>close()},'✕'),
    ));
    const bd = el('div',{class:'modal-bd'}); bd.appendChild(body); m.appendChild(bd);
    if (onConfirm) {
      m.appendChild(el('div',{class:'modal-ft'},
        el('button',{class:'btn ghost',onclick:()=>close()},'Cancel'),
        el('button',{class:'btn',onclick:async()=>{ const ok = await onConfirm(); if (ok) close(true); }},'Save'),
      ));
    }
    bg.appendChild(m);
    document.body.appendChild(bg);
    _currentModal = bg;
  });
}
function closeModal() {
  if (_currentModal) { _currentModal.remove(); _currentModal = null; }
}

function renderLogin() {
  document.body.innerHTML = '';
  document.body.appendChild(el('div',{id:'toasts',class:'toasts'}));
  const errBox = el('div',{class:'err',style:{display:'none'}});
  const email = el('input',{class:'input',type:'email',placeholder:'your@email.com'});
  const pw = el('input',{class:'input',type:'password',placeholder:'••••••••'});

  const onLogin = async () => {
    errBox.style.display = 'none';
    const { error } = await state.sb.auth.signInWithPassword({ email: email.value, password: pw.value });
    if (error) { errBox.textContent = error.message; errBox.style.display = 'block'; return; }
    await afterLogin();
  };

  document.body.appendChild(el('div',{class:'center-screen'},
    el('div',{class:'center-card'},
      el('h1',{html:'rezy<span class="dot">·</span>pedia'}),
      el('div',{class:'tag'}, 'Tools for the bar'),
      errBox,
      el('div',{class:'field'}, el('label',{},'Email'), email),
      el('div',{class:'field'}, el('label',{},'Password'), pw),
      el('button',{class:'btn',style:{width:'100%',marginTop:'6px'},onclick:onLogin},'Log in'),
      el('div',{class:'help'},'Users are created manually by admin in Supabase. Contact your bar manager.'),
    )
  ));
  pw.addEventListener('keydown', e => { if (e.key === 'Enter') onLogin(); });
}

function renderNoTenant() {
  document.body.innerHTML = '';
  document.body.appendChild(el('div',{class:'center-screen'},

      el('h1',{html:'rezy<span class="dot">·</span>pedia'}),
      el('div',{class:'tag'}, 'No access'),
      el('p',{}, 'Your account is not linked to any bar. Contact your admin.'),
      el('button',{class:'btn ghost',style:{marginTop:'12px'},onclick:async()=>{await state.sb.auth.signOut();}}, 'Log out'),
    )
  ));
}
