<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5E0E26">
<title>rezypedia.com</title>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">

<style>
:root{
  --primary:#8A1538;
  --primary-dark:#5E0E26;
  --secondary:#043C57;
  --accent:#B7873B;
  --accent-dark:#573B08;
  --background:#F7F1E7;
  --paper:#FFFDF8;
  --ink:#1A1A1A;
  --ink-soft:#4A4140;
  --ink-mute:#8A7E7B;
  --line:rgba(26,26,26,.10);
  --line-strong:rgba(26,26,26,.22);
  --danger:#B0273C;
  --warn:#A87413;
  --ok:#2C6E3A;
  --display-font:'Playfair Display',serif;
  --body-font:'Inter',system-ui,sans-serif;
  --radius:14px;
  --shadow-1:0 1px 2px rgba(26,26,26,.06),0 2px 8px rgba(26,26,26,.04);
  --shadow-2:0 4px 16px rgba(26,26,26,.10),0 1px 3px rgba(26,26,26,.06);
  --header-h:56px;
  --nav-h:64px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--background);color:var(--ink);font-family:var(--body-font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{padding-top:var(--header-h);padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--primary);text-decoration:none}

/* ===== HEADER ===== */
.topbar{
  position:fixed;top:0;left:0;right:0;height:var(--header-h);
  background:var(--primary-dark);color:#fff;
  display:flex;align-items:center;gap:10px;padding:0 14px;
  z-index:50;
  box-shadow:0 1px 0 rgba(0,0,0,.15),0 2px 8px rgba(0,0,0,.12);
}
.brand{font-family:var(--display-font);font-weight:700;font-size:22px;letter-spacing:.02em}
.brand .dot{color:var(--accent);font-style:italic}
.tenant-switch{
  margin-left:auto;display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
  padding:6px 10px;border-radius:999px;font-size:13px;color:#fff;
  min-height:36px;
}
.tenant-switch select{background:transparent;color:#fff;border:none;font-weight:600;padding-right:4px}
.tenant-switch select option{color:#000}
.icon-btn{
  width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.06);color:#fff;
}
.icon-btn:hover{background:rgba(255,255,255,.14)}

/* ===== NAV ===== */
.bottomnav{
  position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  background:var(--paper);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);
  padding-bottom:env(safe-area-inset-bottom);
  z-index:50;
}
.nav-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-mute);font-weight:600;
  min-height:44px;padding:6px 2px;
}
.nav-btn .ic{font-size:18px;line-height:1}
.nav-btn.active{color:var(--primary)}
.nav-btn.active .ic{color:var(--primary)}

/* ===== LAYOUT ===== */
.view{padding:18px 16px 24px}
.section-hd{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.section-hd h1{font-family:var(--display-font);font-weight:700;font-size:30px;margin:0;letter-spacing:-.01em;color:var(--ink)}
.section-hd .sub{font-size:13px;color:var(--ink-mute);font-style:italic;font-family:var(--display-font)}
.section-hd .rule{flex:1;height:1px;background:var(--line-strong);margin:0 8px}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-1);overflow:hidden}
.card + .card{margin-top:12px}
.card-hd{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card-hd h2{margin:0;font-family:var(--display-font);font-weight:700;font-size:20px}
.card-bd{padding:14px 16px}
.row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .grow{flex:1;min-width:0}
.row .grow .ttl{font-weight:600}
.row .grow .sb{font-size:12px;color:var(--ink-mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .right{font-variant-numeric:tabular-nums;text-align:right;color:var(--ink-soft)}
.row.click{cursor:pointer}
.row.click:hover{background:rgba(138,21,56,.04)}

/* ===== STAT TILES ===== */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px;
  position:relative;overflow:hidden;
}
.stat .lab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-mute);font-weight:600}
.stat .num{font-family:var(--display-font);font-size:34px;font-weight:700;line-height:1.05;margin-top:4px;color:var(--primary)}
.stat .num.s{color:var(--secondary)}
.stat .num.a{color:var(--accent-dark)}

/* ===== CHIPS / BADGES ===== */
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:rgba(138,21,56,.08);color:var(--primary-dark)}
.chip.s{background:rgba(4,60,87,.08);color:var(--secondary)}
.chip.a{background:rgba(183,135,59,.12);color:var(--accent-dark)}
.chip.warn{background:rgba(168,116,19,.12);color:var(--warn)}
.chip.bad{background:rgba(176,39,60,.12);color:var(--danger)}
.chip.ok{background:rgba(44,110,58,.12);color:var(--ok)}

/* ===== FORM ===== */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-mute);font-weight:600}
.input,select.input,textarea.input{
  width:100%;background:var(--paper);border:1px solid var(--line-strong);border-radius:10px;
  padding:11px 12px;min-height:44px;font-size:15px;color:var(--ink);
  transition:border-color .15s, box-shadow .15s;
}
.input:focus,select.input:focus,textarea.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(138,21,56,.15)}
textarea.input{min-height:88px;resize:vertical}
.search{
  width:100%;background:var(--paper);border:1px solid var(--line-strong);border-radius:999px;padding:10px 14px;
  min-height:42px;font-size:14px;margin-bottom:12px;
}

/* ===== BUTTONS ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 16px;min-height:44px;border-radius:10px;
  font-weight:600;font-size:14px;letter-spacing:.02em;
  background:var(--primary);color:#fff;border:1px solid var(--primary-dark);
  transition:transform .08s, background .15s, box-shadow .15s;
}
.btn:hover{background:var(--primary-dark)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--primary);border-color:var(--line-strong)}
.btn.ghost:hover{background:rgba(138,21,56,.05)}
.btn.sec{background:var(--secondary);border-color:#022a3d}
.btn.sec:hover{background:#022a3d}
.btn.acc{background:var(--accent);border-color:var(--accent-dark);color:#fff}
.btn.acc:hover{background:var(--accent-dark)}
.btn.danger{background:var(--danger);border-color:#7a1928;color:#fff}
.btn.ghost.danger{background:var(--danger);border-color:#7a1928;color:#fff}
.btn.ghost.danger:hover{background:#7a1928;color:#fff}
.btn.sm{padding:6px 10px;min-height:32px;font-size:12px;border-radius:8px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* ===== TOAST ===== */
.toasts{position:fixed;top:calc(var(--header-h) + 8px);left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;width:min(92%,420px)}
.toast{
  background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;font-size:14px;
  box-shadow:var(--shadow-2);display:flex;gap:10px;align-items:center;
  animation:tin .25s ease-out;
}
.toast.ok{background:var(--ok)}
.toast.bad{background:var(--danger)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* ===== MODAL ===== */
.modal-bg{position:fixed;inset:0;background:rgba(26,26,26,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fin .2s ease-out}
@keyframes fin{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--paper);width:100%;max-width:560px;max-height:92vh;border-radius:18px 18px 0 0;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-2);
  animation:min .25s ease-out;
}
@keyframes min{from{transform:translateY(20px)}to{transform:none}}
@media(min-width:720px){
  .modal-bg{align-items:center}
  .modal{border-radius:18px}
}
.modal-hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--paper);position:sticky;top:0}
.modal-hd h3{margin:0;font-family:var(--display-font);font-size:20px;font-weight:700;flex:1}
.modal-bd{padding:16px 18px;overflow:auto;flex:1}
.modal-ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:var(--paper)}

/* ===== SETUP / LOGIN ===== */
.center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,var(--background) 0%,#EEE3D2 100%)}
.center-card{width:100%;max-width:420px;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-2);padding:28px 24px}
.center-card h1{font-family:var(--display-font);font-size:36px;font-weight:700;margin:0 0 4px;color:var(--primary)}
.center-card h1 .dot{color:var(--accent);font-style:italic}
.center-card .tag{font-size:13px;color:var(--ink-mute);font-style:italic;font-family:var(--display-font);margin-bottom:24px}
.center-card .err{background:rgba(176,39,60,.08);color:var(--danger);padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px}
.center-card .help{font-size:12px;color:var(--ink-mute);line-height:1.5;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.center-card code{background:rgba(26,26,26,.06);padding:1px 5px;border-radius:4px;font-size:12px}

/* ===== COCKTAIL / PREP DETALJER ===== */
.cocktail-hero{
  background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);
  color:#fff;padding:22px 18px;border-radius:var(--radius);margin-bottom:14px;
  position:relative;overflow:hidden;
}
.cocktail-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,rgba(183,135,59,.30),transparent 50%);pointer-events:none}
.cocktail-hero h2{font-family:var(--display-font);font-size:32px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
.cocktail-hero .menu{font-style:italic;font-family:var(--display-font);font-size:15px;opacity:.92;line-height:1.4}
.cocktail-hero .meta{margin-top:14px;display:flex;gap:14px;font-size:12px;opacity:.88}
.cocktail-hero .meta b{color:var(--accent);display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-bottom:2px}

.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:14px}
.kv dt{color:var(--ink-mute);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;padding-top:3px}
.kv dd{margin:0;color:var(--ink)}

.cost-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cost-tile{background:rgba(138,21,56,.04);border:1px solid var(--line);border-radius:10px;padding:12px}
.cost-tile .lab{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-mute);font-weight:600}
.cost-tile .val{font-family:var(--display-font);font-size:22px;font-weight:700;margin-top:2px}
.cost-tile.warn{background:rgba(168,116,19,.08);border-color:rgba(168,116,19,.30)}
.cost-tile.bad{background:rgba(176,39,60,.08);border-color:rgba(176,39,60,.30)}
.cost-tile.ok{background:rgba(44,110,58,.06);border-color:rgba(44,110,58,.25)}

/* Tabel-vise inventory */
.inv-row{display:grid;grid-template-columns:1fr auto;gap:6px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:center}
.inv-row .name{font-weight:600}
.inv-row .meta{font-size:11px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.05em}
.inv-row .stock{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.inv-row .stock.low{color:var(--danger)}
.inv-row .stock.ok{color:var(--ok)}

/* ===== EMPTY ===== */
.empty{text-align:center;padding:48px 20px;color:var(--ink-mute)}
.empty .big{font-family:var(--display-font);font-size:22px;color:var(--ink);margin-bottom:6px}

/* ===== LOADING ===== */
.spinner{
  width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--primary);
  border-radius:50%;animation:spin .8s linear infinite;margin:30px auto;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== GUEST SHIFT ===== */
.gs-cocktail{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;margin-bottom:12px;page-break-inside:avoid;
}
.gs-cocktail h3{font-family:var(--display-font);font-size:22px;font-weight:700;margin:0 0 4px;color:var(--primary)}
.gs-cocktail .gs-menu{font-style:italic;font-family:var(--display-font);font-size:14px;color:var(--ink-soft);margin-bottom:10px}
.gs-cocktail .gs-flavour{font-size:13px;color:var(--ink-soft);margin-bottom:10px;line-height:1.5}
.gs-cocktail .gs-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 14px;font-size:12px}
.gs-cocktail .gs-grid b{color:var(--ink-mute);text-transform:uppercase;letter-spacing:.06em;font-size:10px;font-weight:600;display:block}
.gs-cocktail .gs-allerg{margin-top:10px;font-size:11px;color:var(--ink-mute);font-style:italic;border-top:1px solid var(--line);padding-top:8px}

/* ===== HOME HUB ===== */
.hub{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.hub-btn{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow-1);padding:22px 14px;min-height:110px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  transition:transform .08s, box-shadow .15s;
}
.hub-btn:active{transform:translateY(1px)}
.hub-btn .ic{font-size:28px;color:var(--primary)}
.hub-btn .lb{font-family:var(--display-font);font-weight:700;font-size:18px;color:var(--ink)}

/* ===== PRINT ===== */
@media print{
  .topbar,.bottomnav,.no-print{display:none !important}
  body{background:#fff;padding:0;color:#000}
  .card,.gs-cocktail{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  .view{padding:0}
  @page{margin:14mm}
}
</style>
</head>
<body>

<!-- Toast container -->
<div class="toasts" id="toasts"></div>

<!-- Root -->
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ============================================================================
// REZYPEDIA.COM — single-file app
// ============================================================================

const SUPABASE_CONFIG = {
  url: 'https://gnhmnsstchpmjibujthb.supabase.co',
  anonKey: 'sb_publishable_vhcOhNuZod5hbv6p3pFn_A_sM5rydim'
};

// ---- feature flags ----
// Sæt til true for at tænde sektionen igen. Koden er ikke slettet.
const FEATURES = {
  orders: false,
};

// ---- state ----
const state = {
  sb: null,
  user: null,
  tenants: [],          // tenants user is member of, with role
  activeTenantId: null,
  route: '#index',
  data: {               // cached for active tenant
    ingredients: [],
    preps: [],
    prep_components: [],
    cocktails: [],
    cocktail_components: [],
    menu_groups: [],
    menus: [],
    menu_cocktails: [],
    events: [],
    event_cocktails: [],
    event_prep_resp: [],
  },
  menuFilter: 'all',      // 'all' | 'nomenu' | menu-id  (Cocktails page)
  svcGroupId: null,       // valgt gruppe på Service-siden
  svcMenuId: null,        // valgt menu på Service-siden
  loading: false,
  rtChannel: null,
};

const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const el = (tag, attrs={}, ...children) => {
  const e = document.createElement(tag);
  for (const k in attrs) {
    if (k === 'class') e.className = attrs[k];
    else if (k === 'html') e.innerHTML = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    else if (k === 'style' && typeof attrs[k] === 'object') Object.assign(e.style, attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return e;
};

// Currency + locale læses fra aktiv tenant (med fornuftige fallbacks)
function currentTenant() {
  return state.tenants.find(t => t.id === state.activeTenantId);
}
function currentCurrency() { return currentTenant()?.currency || 'DKK'; }
function currentLocale()   { return currentTenant()?.locale   || 'da-DK'; }

const money = n => (n == null || isNaN(n)) ? '—' : new Intl.NumberFormat(currentLocale(),{style:'currency',currency:currentCurrency(),maximumFractionDigits:2}).format(n);
// Bagudkompatibilitet: dkk() er alias for money() — alle eksisterende kald virker stadig
const dkk = money;
const num = (n, d=2) => (n == null || isNaN(n)) ? '—' : Number(n).toLocaleString(currentLocale(),{minimumFractionDigits:0,maximumFractionDigits:d});
// Unit-price uden valuta (priser pr. ml/gr/stk vises som rent tal — valuta findes på sell prices)
const unitPrice = (n, d=2) => (n == null || isNaN(n)) ? '—' : Number(n).toLocaleString(currentLocale(),{minimumFractionDigits:0,maximumFractionDigits:d});

function toast(msg, kind='') {
  const t = el('div', {class:'toast ' + kind}, msg);
  $('#toasts').appendChild(t);
  setTimeout(() => { t.style.opacity = 0; setTimeout(() => t.remove(), 300); }, 2600);
}

function applyTheme(theme) {
  if (!theme) return;
  const r = document.documentElement;
  if (theme.primary)        r.style.setProperty('--primary', theme.primary);
  if (theme.primary_dark)   r.style.setProperty('--primary-dark', theme.primary_dark);
  if (theme.secondary)      r.style.setProperty('--secondary', theme.secondary);
  if (theme.accent)         r.style.setProperty('--accent', theme.accent);
  if (theme.background)     r.style.setProperty('--background', theme.background);
  if (theme.display_font)   r.style.setProperty('--display-font', `'${theme.display_font}', serif`);
  if (theme.body_font)      r.style.setProperty('--body-font', `'${theme.body_font}', system-ui, sans-serif`);
  document.body.style.background = 'var(--background)';
  // Theme-color meta
  const m = document.querySelector('meta[name="theme-color"]');
  if (m && theme.primary_dark) m.content = theme.primary_dark;
}

// ============================================================================
// BOOT
// ============================================================================
async function boot() {
  if (!SUPABASE_CONFIG.url || SUPABASE_CONFIG.url.includes('YOUR-PROJECT')) {
    return renderSetup();
  }
  state.sb = supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);
  state.sb.auth.onAuthStateChange((_evt, session) => {
    state.user = session?.user || null;
    if (!state.user) {
      cleanupRealtime();
      renderLogin();
    }
  });
  const { data: { session } } = await state.sb.auth.getSession();
  state.user = session?.user || null;
  if (!state.user) return renderLogin();
  await afterLogin();
}

async function afterLogin() {
  await loadTenants();
  if (state.tenants.length === 0) {
    return renderNoTenant();
  }
  // Restore active tenant or pick first
  const stored = localStorage.getItem('activeTenantId');
  if (stored && state.tenants.some(t => t.id === stored)) {
    state.activeTenantId = stored;
  } else {
    state.activeTenantId = state.tenants[0].id;
    localStorage.setItem('activeTenantId', state.activeTenantId);
  }
  await switchTenant(state.activeTenantId);
}

async function loadTenants() {
  // Get memberships + tenant (incl. currency + locale)
  const { data, error } = await state.sb
    .from('memberships')
    .select('role, tenant_id, tenants(id, slug, name, city, theme, subscription_tier, currency, locale)')
    .eq('user_id', state.user.id);
  if (error) { toast('Could not load tenants: ' + error.message, 'bad'); return; }
  state.tenants = (data || [])
    .filter(m => m.tenants)
    .map(m => ({ ...m.tenants, role: m.role }));
}

async function switchTenant(tid) {
  state.activeTenantId = tid;
  localStorage.setItem('activeTenantId', tid);
  const t = state.tenants.find(x => x.id === tid);
  applyTheme(t?.theme);
  await loadAll();
  setupRealtime();
  renderApp();
}

function cleanupRealtime() {
  if (state.rtChannel) {
    state.sb.removeChannel(state.rtChannel);
    state.rtChannel = null;
  }
}

function setupRealtime() {
  cleanupRealtime();
  if (!state.activeTenantId) return;
  state.rtChannel = state.sb
    .channel('ingredients-' + state.activeTenantId)
    .on('postgres_changes',
      { event: 'UPDATE', schema: 'public', table: 'ingredients', filter: `tenant_id=eq.${state.activeTenantId}` },
      payload => {
        const idx = state.data.ingredients.findIndex(i => i.id === payload.new.id);
        if (idx >= 0) state.data.ingredients[idx] = payload.new;
        if (location.hash === '#inventory' || location.hash === '#index' || location.hash === '#orders') {
          renderRoute();
        }
      }
    )
    .subscribe();
}

// Cocktails og preps uden event_id er "biblioteket" — det normale sortiment
const normalCocktails = () => state.data.cocktails.filter(c => !c.event_id);
const normalPreps     = () => state.data.preps.filter(p => !p.event_id);
const eventById       = id => state.data.events.find(e => e.id === id) || null;

// Preps der må bruges i et event: biblioteket + eventets egne
const prepsForEvent = eventId =>
  state.data.preps.filter(p => !p.event_id || p.event_id === eventId);

function prepResponsible(eventId, prepId) {
  const r = state.data.event_prep_resp.find(x => x.event_id === eventId && x.prep_id === prepId);
  return r ? r.responsible : 'bar';
}

// Alle preps et event rører — også dem der ligger inde i andre preps
function prepsUsedByEvent(eventId) {
  const found = new Map();   // prep_id -> dybde (0 = direkte i en cocktail)
  const walk = (prepId, depth, seen) => {
    if (seen.has(prepId)) return;
    seen.add(prepId);
    if (!found.has(prepId)) found.set(prepId, depth);
    state.data.prep_components
      .filter(pc => pc.prep_id === prepId && pc.child_prep_id)
      .forEach(pc => walk(pc.child_prep_id, depth + 1, seen));
  };
  state.data.event_cocktails
    .filter(ec => ec.event_id === eventId)
    .forEach(ec => {
      state.data.cocktail_components
        .filter(cc => cc.cocktail_id === ec.cocktail_id && cc.prep_id)
        .forEach(cc => walk(cc.prep_id, 0, new Set()));
    });
  return [...found.keys()]
    .map(id => state.data.preps.find(p => p.id === id))
    .filter(Boolean)
    .sort((a,b) => a.name.localeCompare(b.name));
}

/**
 * Beregner pakkelister for et event.
 *
 * Regel: en prep med ansvar 'bar' regnes videre ned i sine ingredienser.
 * En prep med ansvar 'host' stopper beregningen for baren — værten leverer
 * den færdige prep — og hele prep'ens indhold lægges i stedet på værtens liste.
 *
 * BEGRÆNSNING: der omregnes ikke mellem enheder. Gram og milliliter lægges
 * sammen som rene tal, præcis som i den eksisterende kostberegning.
 */
function computeEventLists(eventId) {
  const bar  = { ingredients:new Map(), preps:new Map(), tools:[] };
  const host = { ingredients:new Map(), preps:new Map() };
  const warnings = [];

  const bump = (map, id, qty, unit) => {
    const cur = map.get(id) || { qty:0, unit };
    cur.qty += qty;
    if (cur.unit !== unit) cur.mixedUnits = true;
    map.set(id, cur);
  };

  // Udfold en prep ned i råvarer. target = hvilken liste ingredienserne havner på.
  function expand(prepId, amount, target, seen) {
    const p = state.data.preps.find(x => x.id === prepId);
    if (!p) return;
    if (seen.has(prepId)) { warnings.push(`${p.name} indeholder sig selv — springet over`); return; }
    if (!p.yield_quantity) { warnings.push(`${p.name} mangler yield — kan ikke skaleres`); return; }
    const next = new Set(seen); next.add(prepId);
    const factor = amount / p.yield_quantity;
    state.data.prep_components.filter(pc => pc.prep_id === prepId).forEach(pc => {
      const q = (pc.quantity || 0) * factor;
      if (pc.ingredient_id) bump(target.ingredients, pc.ingredient_id, q, pc.unit);
      else if (pc.child_prep_id) {
        // Inde i en værts-prep hører hele kæden til værten
        if (target === host) {
          bump(host.preps, pc.child_prep_id, q, pc.unit);
          expand(pc.child_prep_id, q, host, next);
        } else {
          routePrep(pc.child_prep_id, q, pc.unit, next);
        }
      }
    });
  }

  // Afgør hvem der har ansvaret, og send prep'en den rigtige vej
  function routePrep(prepId, amount, unit, seen) {
    if (prepResponsible(eventId, prepId) === 'host') {
      bump(host.preps, prepId, amount, unit);
      expand(prepId, amount, host, seen);
    } else {
      bump(bar.preps, prepId, amount, unit);
      expand(prepId, amount, bar, seen);
    }
  }

  state.data.event_cocktails
    .filter(ec => ec.event_id === eventId)
    .forEach(ec => {
      const c = state.data.cocktails.find(x => x.id === ec.cocktail_id);
      if (!c) return;
      const n = ec.quantity || 0;
      if (n <= 0) return;
      if (c.tools) bar.tools.push({ cocktail:c.name, tools:c.tools });
      state.data.cocktail_components
        .filter(cc => cc.cocktail_id === c.id)
        .forEach(cc => {
          const q = (cc.quantity || 0) * n;
          // Ingredienser direkte i en cocktail er altid barens
          if (cc.ingredient_id) bump(bar.ingredients, cc.ingredient_id, q, cc.unit);
          else if (cc.prep_id) routePrep(cc.prep_id, q, cc.unit, new Set());
        });
    });

  return { bar, host, warnings };
}

// Kostpris, omsætning og margin for hele eventet
function eventTotals(eventId) {
  let cost = 0, revenue = 0, drinks = 0;
  const missing = [];
  state.data.event_cocktails.filter(ec => ec.event_id === eventId).forEach(ec => {
    const c = state.data.cocktails.find(x => x.id === ec.cocktail_id);
    if (!c) return;
    const n = ec.quantity || 0;
    drinks += n;
    const r = cocktailCost(c.id);
    if (r.missing && r.missing.length) missing.push(c.name);
    cost    += (r.cost || 0) * n;
    revenue += (c.sell_price || 0) * n;
  });
  const margin = revenue ? ((revenue - cost) / revenue) * 100 : null;
  return { cost, revenue, drinks, margin, missing };
}
// ============================================================================
// COST CALCULATION
// ============================================================================
function ingredientPricePerUnit(ing) {
  if (!ing || !ing.purchase_price || !ing.purchase_size) return null;
  return ing.purchase_price / ing.purchase_size;
}

/**
 * Calculates price per unit (of yield_unit) for a prep.
 * Recursive via child_preps. Returns null if any component is missing a price.
 *
 * KNOWN LIMITATION: we do not convert between units (gr vs ml).
 * Sum of component costs is divided by yield_quantity regardless of units.
 */
function prepPricePerUnit(prepId, visited = new Set()) {
  if (visited.has(prepId)) return null; // cycle guard
  visited.add(prepId);
  const prep = state.data.preps.find(p => p.id === prepId);
  if (!prep) return null;
  const comps = state.data.prep_components.filter(c => c.prep_id === prepId);
  if (comps.length === 0) return null;
  let total = 0;
  for (const c of comps) {
    let costPer = null;
    if (c.ingredient_id) {
      const ing = state.data.ingredients.find(i => i.id === c.ingredient_id);
      costPer = ingredientPricePerUnit(ing);
    } else if (c.child_prep_id) {
      costPer = prepPricePerUnit(c.child_prep_id, new Set(visited));
    }
    if (costPer == null) return null;
    total += costPer * c.quantity;
  }
  if (!prep.yield_quantity) return null;
  return total / prep.yield_quantity;
}

function cocktailCost(cocktailId) {
  const comps = state.data.cocktail_components.filter(c => c.cocktail_id === cocktailId);
  if (comps.length === 0) return { cost: 0, missing: [] };
  let total = 0;
  const missing = [];
  for (const c of comps) {
    let costPer = null;
    let name = '?';
    if (c.ingredient_id) {
      const ing = state.data.ingredients.find(i => i.id === c.ingredient_id);
      name = ing?.name || 'ingredient';
      costPer = ingredientPricePerUnit(ing);
    } else if (c.prep_id) {
      const p = state.data.preps.find(x => x.id === c.prep_id);
      name = p?.name || 'prep';
      costPer = prepPricePerUnit(c.prep_id);
    }
    if (costPer == null) { missing.push(name); continue; }
    total += costPer * c.quantity;
  }
  return { cost: total, missing };
}

function renderRoute() {
  const main = $('#main');
  if (!main) return;
  main.innerHTML = '';
  const h = location.hash || '#index';
  const v = el('div', { class: 'view' });
  main.appendChild(v);
  if (state.loading) {
    v.appendChild(el('div', { class: 'spinner' }));
    return;
  }
  if (h.startsWith('#cocktail/')) return renderCocktailDetail(v, h.split('/')[1]);
  if (h.startsWith('#eventmenu/')) return renderEventMenu(v, h.split('/')[1]);
  if (h.startsWith('#eventhost/')) return renderEventHostDoc(v, h.split('/')[1]);
  if (h.startsWith('#event/'))    return renderEventDetail(v, h.split('/')[1]);
  if (h.startsWith('#prep/'))     return renderPrepDetail(v, h.split('/')[1]);
  switch (h) {
    case '#cocktails': return renderCocktails(v);
    case '#prep':      return renderPreps(v);
    case '#inventory': return renderInventory(v);
    case '#menus':     return renderMenus(v);
    case '#events':    return renderEvents(v);
    case '#orders':
      if (!FEATURES.orders) { location.hash = '#index'; return renderIndex(v); }
      return renderOrders(v);
    case '#guest':     return renderGuestShift(v);
    case '#index':
    default:           return renderIndex(v);
  }
}

function renderCocktails(v) {
  const isAdmin = currentRole() === 'admin';
  v.appendChild(el('div', { class: 'section-hd' },
    el('h1', {}, 'Cocktails'),
    el('div', { class: 'rule' }),
    el('div', { class: 'sub' }, `${normalCocktails().length} items`),
  ));

  const q = el('input', { class: 'search', placeholder: 'Search cocktail or ingredient…', oninput: () => render() });
  const onlyActive = el('label', { class: 'chip s', style:{cursor:'pointer'} },
    el('input', { type:'checkbox', id:'onlyactive', style:{marginRight:'4px'}, onchange: () => render() }),
    'Active only',
  );
  v.appendChild(q);

  // -- Gruppe/menu-filter --
  const menuSel = el('select', { class:'input', style:{maxWidth:'260px',padding:'8px 6px',minHeight:'38px',fontSize:'13px'},
    onchange: e => { state.menuFilter = e.target.value; render(); } });
  menuSel.appendChild(el('option', { value:'all' }, 'All cocktails'));
  ungroupedMenus().forEach(m => menuSel.appendChild(el('option', { value:m.id }, m.name)));
  groupsWithMenus().forEach(g => {
    const og = el('optgroup', { label: g.name });
    menusInGroup(g.id).forEach(m => og.appendChild(el('option', { value:m.id }, m.name)));
    menuSel.appendChild(og);
  });
  if (state.data.menus.length > 0) {
    menuSel.appendChild(el('option', { value:'nomenu' }, '— Not on any menu —'));
  }
  menuSel.value = state.menuFilter;

  const controls = el('div', { style:{ display:'flex', alignItems:'center', gap:'10px',
    flexWrap:'wrap', marginBottom:'10px' } }, onlyActive);
  if (state.data.menus.length > 0) controls.appendChild(menuSel);
  v.appendChild(controls);

  const list = el('div', { class: 'card' });
  v.appendChild(list);

  if (isAdmin) {
    v.appendChild(el('div', { class: 'btn-row', style: { marginTop: '12px' } },
      el('button', { class: 'btn', onclick: () => openCocktailEditor(null) }, '+ New cocktail'),
    ));
  }

  function render() {
    const term = q.value.toLowerCase().trim();
    const filterActive = $('#onlyactive')?.checked;
    list.innerHTML = '';
    let rows = normalCocktails();
    if (filterActive) rows = rows.filter(c => c.is_active);
    if (state.menuFilter === 'nomenu') {
      rows = rows.filter(c => menuIdsForCocktail(c.id).length === 0);
    } else if (state.menuFilter !== 'all') {
      const ids = new Set(cocktailIdsOnMenu(state.menuFilter));
      rows = rows.filter(c => ids.has(c.id));
    }
    if (term) {
      rows = rows.filter(c =>
        (c.name||'').toLowerCase().includes(term) ||
        (c.menu_wording||'').toLowerCase().includes(term)
      );
    }
    if (rows.length === 0) {
      list.appendChild(el('div', { class: 'empty' },
        el('div', { class: 'big' }, 'No cocktails'),
        el('div', {}, 'Adjust search or create a new one.')
      ));
      return;
    }
    rows.forEach(c => {
      const { cost, missing } = cocktailCost(c.id);
      const margin = c.sell_price && cost ? ((c.sell_price - cost) / c.sell_price) * 100 : null;
      const row = el('div', { class: 'row click', onclick: () => location.hash = '#cocktail/' + c.id },
        el('div', { class: 'grow' },
          el('div', { class: 'ttl' }, c.name, !c.is_active ? el('span', { class:'chip warn', style:{marginLeft:'6px'} }, 'INACTIVE') : null),
          el('div', { class: 'sb' }, c.menu_wording || ''),
        ),
        el('div', { class: 'right' },
          el('div', { style:{fontWeight:600} }, dkk(c.sell_price)),
          missing.length > 0
            ? el('div', { class:'chip warn', style:{marginTop:'4px'} }, '⚠ price')
            : margin != null
              ? el('div', { class: 'chip ' + (margin < 70 ? 'warn' : 'ok'), style:{marginTop:'4px'} }, num(margin,1) + '%')
              : null,
        ),
      );
      list.appendChild(row);
    });
  }
  render();
}

function renderPreps(v) {
  v.appendChild(el('div',{class:'section-hd'},
    el('h1',{},'Prep'),
    el('div',{class:'rule'}),
    el('div',{class:'sub'}, `${normalPreps().length} items`),
  ));

  const q = el('input',{class:'search',placeholder:'Search prep or ingredient…',oninput:()=>render()});
  v.appendChild(q);

  const body = el('div');
  v.appendChild(body);

  if (currentRole() === 'admin') {
    v.appendChild(el('div',{class:'btn-row',style:{marginTop:'12px'}},
      el('button',{class:'btn', onclick:() => openPrepEditor(null)},'+ New prep'),
    ));
  }

  // Navnene på det en prep indeholder — ingredienser og child-preps
  function componentNames(prepId) {
    return state.data.prep_components
      .filter(c => c.prep_id === prepId)
      .map(c => {
        if (c.ingredient_id) return state.data.ingredients.find(i => i.id === c.ingredient_id)?.name;
        if (c.child_prep_id) return state.data.preps.find(p => p.id === c.child_prep_id)?.name;
        return null;
      })
      .filter(Boolean);
  }

  function render() {
    const term = q.value.toLowerCase().trim();
    body.innerHTML = '';

    let preps = normalPreps();
    if (term) {
      preps = preps.filter(p =>
        (p.name||'').toLowerCase().includes(term) ||
        componentNames(p.id).some(n => n.toLowerCase().includes(term))
      );
    }

    const types = ['PREMIX','BATCH','SYRUP','INFUSION','CORDIAL'];
    let shown = 0;

    types.forEach(t => {
      const arr = preps.filter(p => p.type === t);
      if (arr.length === 0) return;   // tomme grupper skjules
      shown += arr.length;
      const c = el('div',{class:'card'});
      c.appendChild(el('div',{class:'card-hd'},
        el('h2',{}, t.charAt(0) + t.slice(1).toLowerCase()),
        el('span',{class:'chip'}, String(arr.length)),
      ));
      arr.forEach(p => {
        // Vis hvilken ingrediens der gav match, hvis det ikke var navnet
        let hint = null;
        if (term && !(p.name||'').toLowerCase().includes(term)) {
          const hits = componentNames(p.id).filter(n => n.toLowerCase().includes(term));
          if (hits.length) hint = 'contains: ' + hits.slice(0,3).join(', ');
        }
        c.appendChild(el('div',{class:'row click', onclick:() => location.hash = '#prep/' + p.id},
          el('div',{class:'grow'},
            el('div',{class:'ttl'}, p.name),
            el('div',{class:'sb'}, hint || `Yield: ${num(p.yield_quantity)} ${p.yield_unit}`),
          ),
          el('div',{class:'right'},
            el('span',{class:'chip s'}, p.shelf_life ? p.shelf_life.split('.')[0].slice(0,28) : ''),
          ),
        ));
      });
      body.appendChild(c);
    });

    // Preps uden kendt type ville ellers forsvinde helt
    const other = preps.filter(p => !types.includes(p.type));
    if (other.length) {
      shown += other.length;
      const c = el('div',{class:'card'});
      c.appendChild(el('div',{class:'card-hd'}, el('h2',{},'Other'), el('span',{class:'chip'}, String(other.length))));
      other.forEach(p => {
        c.appendChild(el('div',{class:'row click', onclick:() => location.hash = '#prep/' + p.id},
          el('div',{class:'grow'},
            el('div',{class:'ttl'}, p.name),
            el('div',{class:'sb'}, `Yield: ${num(p.yield_quantity)} ${p.yield_unit}`),
          ),
        ));
      });
      body.appendChild(c);
    }

    if (shown === 0) {
      body.appendChild(el('div',{class:'empty'},
        el('div',{class:'big'},'No preps'),
        el('div',{}, term ? 'Nothing matches that search.' : 'Create your first prep.'),
      ));
    }
  }
  render();
}

  const p = state.data.preps.find(x => x.id === id);
  if (!p) { v.appendChild(el('div',{class:'empty'}, 'Prep not found.')); return; }

  hero.appendChild(el('div',{class:'meta'},
    el('div',{}, el('b',{},'Yield'), `${num(p.yield_quantity)} ${p.yield_unit}`),
    el('div',{}, el('b',{},'Shelf life'), p.shelf_life ? p.shelf_life.slice(0,40) : '—'),
    el('div',{}, el('b',{},'Cost / '+p.yield_unit), ppu != null ? unitPrice(ppu) : '—'),
  ));

  // Scaling tool

  const out = el('div',{style:{marginTop:'10px'}});
  function recalc() {
    const factor = Number(inp.value) || 1;

    out.appendChild(el('div',{style:{fontSize:'13px',color:'var(--ink-mute)',marginBottom:'8px'}},
      `Scale to ${num(p.yield_quantity * factor)} ${p.yield_unit}:`));

      else if (c.child_prep_id) name = state.data.preps.find(x => x.id === c.child_prep_id)?.name || 'prep';
      out.appendChild(el('div',{class:'row',style:{borderBottom:'1px solid var(--line)',padding:'8px 0'}},
        el('div',{class:'grow'}, el('div',{class:'ttl'}, name)),
        el('div',{class:'right'}, `${num(c.quantity * factor, 1)} ${c.unit}`),
      ));
    });
  }
  inp.addEventListener('input', recalc);
  sb.appendChild(el('div',{class:'field'},
    el('label',{},'Multiplier'),
    inp,
  ));
  sb.appendChild(out);
  scale.appendChild(sb);
  v.appendChild(scale);

  // Components
  const compCard = el('div',{class:'card'});
  compCard.appendChild(el('div',{class:'card-hd'}, el('h2',{},'Components')));
  comps.forEach(c => {
    let label = '?', sub = '';

      const ing = state.data.ingredients.find(i => i.id === c.ingredient_id);
      label = ing?.name || 'ing'; sub = ing?.category || '';
    } else if (c.child_prep_id) {
      const cp = state.data.preps.find(x => x.id === c.child_prep_id);
      label = cp?.name || 'prep'; sub = 'CHILD PREP';
    }
    compCard.appendChild(el('div',{class:'row'},
      el('div',{class:'grow'}, el('div',{class:'ttl'},label), el('div',{class:'sb'},sub)),
      el('div',{class:'right'}, `${num(c.quantity,2)} ${c.unit}`),

    proc.appendChild(el('div',{class:'card-hd'}, el('h2',{},'Procedure')));
    proc.appendChild(el('div',{class:'card-bd', style:{whiteSpace:'pre-wrap'}}, p.procedure));

  const btnRow = el('div',{class:'btn-row no-print', style:{marginTop:'12px'}});
  btnRow.appendChild(el('button',{class:'btn ghost', onclick:() => window.print()},'🖨 Print'));

  }

}

async function openStockEditor(ing) {
  const inp = el('input',{class:'input',type:'number',value:String(ing.current_stock || 0), step:'1'});
  await modal('Update stock — ' + ing.name, el('div',{class:'field'},
    el('label',{}, `Current stock (${ing.purchase_unit || ''})`),
    inp,
    el('div',{style:{fontSize:'12px',color:'var(--ink-mute)',marginTop:'8px'}},
      `Min. ${ing.min_stock || 0} ${ing.purchase_unit || ''}`),
  ), async () => {
    const val = Number(inp.value);
    if (isNaN(val)) return toast('Invalid value','bad');
    const { error } = await state.sb.from('ingredients').update({ current_stock: val }).eq('id', ing.id);
    if (error) return toast(error.message, 'bad');
    ing.current_stock = val;
    toast('Stock updated','ok');
    renderRoute();
    return true;
  });
}

async function openIngredientEditor(ing) {
  const isNew = !ing;
  const f = ing ? { ...ing } : {
    name:'', category:'', supplier:'', purchase_size:'', purchase_unit:'ml',
    purchase_price:'', min_stock:0, current_stock:0, barcode:'',
  };
  const form = el('div',{});
  function fld(label, key, type='text', extra={}) {
    const id = 'fld_' + key;
    const inp = el(type === 'textarea' ? 'textarea' : 'input',
      Object.assign({ class:'input', id, value: f[key] ?? '', ...(type !== 'textarea' ? { type } : {}),
        oninput: e => f[key] = type==='number' ? (e.target.value === '' ? null : Number(e.target.value)) : e.target.value
      }, extra));
    form.appendChild(el('div',{class:'field'}, el('label',{for:id}, label), inp));
  }
  fld('Name','name');
  fld('Category','category');
  fld('Supplier','supplier');
  fld('Purchase size','purchase_size','number');
  fld('Unit','purchase_unit');
  fld(`Purchase price (${currentCurrency()})`,'purchase_price','number');
  fld('Min. stock','min_stock','number');
  fld('Barcode','barcode');

  await modal(isNew ? 'New ingredient' : 'Edit ingredient', form, async () => {
    if (!f.name) return toast('Name required','bad');
    const payload = {
      tenant_id: state.activeTenantId,
      name: f.name, category: f.category || null, supplier: f.supplier || null,
      purchase_size: f.purchase_size || null, purchase_unit: f.purchase_unit || null,
      purchase_price: f.purchase_price || null,
      min_stock: f.min_stock || 0,
      barcode: f.barcode || null,
    };
    if (isNew) payload.current_stock = f.current_stock || 0;
    const q = isNew
      ? state.sb.from('ingredients').insert(payload).select().single()
      : state.sb.from('ingredients').update(payload).eq('id', ing.id).select().single();
    const { data, error } = await q;
    if (error) return toast(error.message, 'bad');
    if (isNew) state.data.ingredients.push(data);
    else Object.assign(ing, data);
    toast('Saved','ok');
    renderRoute();
    return true;
  });
}

// --- Barcode scanner ---
async function openBarcodeScanner() {
  if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
    return toast('Barcode scanning requires HTTPS','bad');
  }
  if (!('BarcodeDetector' in window)) {
    return toast('BarcodeDetector not supported. ZXing fallback not included in this build.','bad');
  }
  const video = el('video',{autoplay:true, muted:true, playsinline:true, style:{width:'100%',borderRadius:'10px',background:'#000'}});
  const status = el('div',{style:{fontSize:'13px',color:'var(--ink-mute)',textAlign:'center',marginTop:'8px'}}, 'Hold the barcode up to the camera…');
  let stream = null, raf = null;
  const cleanup = () => {
    if (raf) cancelAnimationFrame(raf);
    if (stream) stream.getTracks().forEach(t => t.stop());
  };
  await modal('Scan barcode', el('div',{},video,status), null, cleanup);
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } });
    video.srcObject = stream;
    const det = new BarcodeDetector({ formats:['ean_13','ean_8','code_128','upc_a','upc_e','qr_code'] });
    const scan = async () => {
      try {
        const codes = await det.detect(video);
        if (codes.length > 0) {
          const code = codes[0].rawValue;
          cleanup();
          closeModal();
          const hit = state.data.ingredients.find(i => i.barcode === code);
          if (hit) {
            toast('Found: ' + hit.name, 'ok');
            openStockEditor(hit);
          } else {
            if (confirm('Barcode not found (' + code + '). Create new ingredient?')) {
              openIngredientEditor({ barcode: code });
            }
          }
          return;
        }
      } catch(e) { /* ignore */ }
      raf = requestAnimationFrame(scan);
    };
    scan();
  } catch(e) {
    toast('Camera error: ' + e.message, 'bad');
    closeModal();
  }
}

function renderForecast(body) {
  // Choose cocktails + quantity
  const counts = JSON.parse(localStorage.getItem('forecast_counts_' + state.activeTenantId) || '{}');

  const list = el('div',{class:'card'});
  list.appendChild(el('div',{class:'card-hd'}, el('h2',{},'Expected sales per cocktail')));
  state.data.cocktails.filter(c => c.is_active).forEach(c => {
    const inp = el('input',{type:'number',min:'0',value:String(counts[c.id]||0), class:'input', style:{maxWidth:'90px',padding:'6px 8px',minHeight:'36px'}, oninput:e=>{
      counts[c.id] = Number(e.target.value) || 0;
      localStorage.setItem('forecast_counts_'+state.activeTenantId, JSON.stringify(counts));
      compute();
    }});
    list.appendChild(el('div',{class:'row'},
      el('div',{class:'grow'}, el('div',{class:'ttl'}, c.name), el('div',{class:'sb'}, c.menu_wording||'')),
      el('div',{class:'right'}, inp),
    ));
  });
  body.appendChild(list);

  const result = el('div',{style:{marginTop:'14px'}});
  body.appendChild(result);

  function ingredientUsage() {
    // returns Map<ingredient_id, qty> — uses ingredient's purchase_unit aggregate (no unit conversion!)
    const usage = new Map();
    function addIng(ingId, qty) {
      usage.set(ingId, (usage.get(ingId) || 0) + qty);
    }
    function expandPrep(prepId, qtyOfPrep) {
      const prep = state.data.preps.find(p => p.id === prepId);
      if (!prep || !prep.yield_quantity) return;
      const ratio = qtyOfPrep / prep.yield_quantity;
      const comps = state.data.prep_components.filter(c => c.prep_id === prepId);
      comps.forEach(c => {
        if (c.ingredient_id) addIng(c.ingredient_id, c.quantity * ratio);
        else if (c.child_prep_id) expandPrep(c.child_prep_id, c.quantity * ratio);
      });
    }
    for (const [cid, n] of Object.entries(counts)) {
      if (!n) continue;
      const comps = state.data.cocktail_components.filter(cc => cc.cocktail_id === cid);
      comps.forEach(c => {
        if (c.ingredient_id) addIng(c.ingredient_id, c.quantity * n);
        else if (c.prep_id) expandPrep(c.prep_id, c.quantity * n);
      });
    }
    return usage;
  }

  function compute() {
    result.innerHTML = '';
    const usage = ingredientUsage();
    if (usage.size === 0) {
      result.appendChild(el('div',{class:'empty'}, el('div',{class:'big'},'Set cocktail counts')));
      return;
    }
    // Calculate order: need usage - current_stock, rounded up to purchase_size units
    const bySupplier = new Map();
    for (const [ingId, used] of usage.entries()) {
      const ing = state.data.ingredients.find(i => i.id === ingId);
      if (!ing) continue;
      const have = ing.current_stock || 0;
      const target = Math.max(used, ing.min_stock || 0);
      const need = target - have;
      if (need <= 0) continue;
      const units = ing.purchase_size ? Math.ceil(need / ing.purchase_size) : 1;
      const supplier = ing.supplier || 'No supplier';
      if (!bySupplier.has(supplier)) bySupplier.set(supplier, []);
      bySupplier.get(supplier).push({ ing, used, need, units });
    }
    if (bySupplier.size === 0) {
      result.appendChild(el('div',{class:'empty'}, el('div',{class:'big'},'Stock covers forecast')));
      return;
    }
    for (const [sup, items] of bySupplier.entries()) {
      const card = el('div',{class:'card'});
      const total = items.reduce((s,it) => s + (it.ing.purchase_price || 0) * it.units, 0);
      card.appendChild(el('div',{class:'card-hd'},
        el('h2',{}, sup),
        el('span',{class:'chip a'}, dkk(total)),
      ));
      items.forEach(it => {
        card.appendChild(el('div',{class:'row'},
          el('div',{class:'grow'},
            el('div',{class:'ttl'}, it.ing.name),
            el('div',{class:'sb'}, `Need: ${num(it.need,1)} ${it.ing.purchase_unit||''}`),
          ),
          el('div',{class:'right'},
            el('div',{style:{fontWeight:600}}, `${it.units} × ${num(it.ing.purchase_size,0)} ${it.ing.purchase_unit||''}`),
            el('div',{class:'sb',style:{fontSize:'12px'}}, dkk((it.ing.purchase_price||0)*it.units)),
          ),
        ));
      });
      card.appendChild(el('div',{class:'card-bd no-print',style:{display:'flex',gap:'8px'}},
        el('button',{class:'btn ghost sm', onclick:()=>exportSupplierCSV(sup,items)},'⇩ CSV'),
        el('button',{class:'btn ghost sm', onclick:()=>exportSupplierMail(sup,items)},'✉ Email'),
      ));
      result.appendChild(card);
    }
  }
  compute();
}

function renderStockOrders(body) {
  const low = state.data.ingredients.filter(i => (i.current_stock||0) < (i.min_stock||0));
  if (low.length === 0) {
    body.appendChild(el('div',{class:'empty'}, el('div',{class:'big'},'Everything in stock'), el('div',{},'No ingredients below minimum.')));
    return;
  }
  const bySupplier = new Map();
  low.forEach(ing => {
    const need = (ing.min_stock || 0) - (ing.current_stock || 0);
    const units = ing.purchase_size ? Math.ceil(need / ing.purchase_size) : 1;
    const sup = ing.supplier || 'No supplier';
    if (!bySupplier.has(sup)) bySupplier.set(sup, []);
    bySupplier.get(sup).push({ ing, need, units });
  });
  for (const [sup, items] of bySupplier.entries()) {
    const card = el('div',{class:'card'});
    const total = items.reduce((s,it)=> s + (it.ing.purchase_price || 0)*it.units, 0);
    card.appendChild(el('div',{class:'card-hd'}, el('h2',{}, sup), el('span',{class:'chip a'}, dkk(total))));
    items.forEach(it => {
      card.appendChild(el('div',{class:'row'},
        el('div',{class:'grow'},
          el('div',{class:'ttl'}, it.ing.name),
          el('div',{class:'sb'}, `${num(it.ing.current_stock||0)}/${num(it.ing.min_stock||0)} ${it.ing.purchase_unit||''}`),
        ),
        el('div',{class:'right'},
          el('div',{style:{fontWeight:600}}, `${it.units} × ${num(it.ing.purchase_size,0)} ${it.ing.purchase_unit||''}`),
          el('div',{class:'sb',style:{fontSize:'12px'}}, dkk((it.ing.purchase_price||0)*it.units)),
        ),
      ));
    });
    card.appendChild(el('div',{class:'card-bd no-print',style:{display:'flex',gap:'8px'}},
      el('button',{class:'btn ghost sm', onclick:()=>exportSupplierCSV(sup,items)},'⇩ CSV'),
      el('button',{class:'btn ghost sm', onclick:()=>exportSupplierMail(sup,items)},'✉ Email'),
    ));
    body.appendChild(card);
  }
}

function exportSupplierCSV(sup, items) {
  const rows = [['Ingredient','Quantity','Unit size','Unit','Unit price','Total']];
  items.forEach(it => rows.push([
    it.ing.name, it.units, it.ing.purchase_size || '', it.ing.purchase_unit || '',
    it.ing.purchase_price || '', (it.ing.purchase_price||0)*it.units,
  ]));
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type:'text/csv' });
  const a = el('a',{href:URL.createObjectURL(blob), download:`order-${sup.replace(/\s+/g,'_')}.csv`});
  document.body.appendChild(a); a.click(); a.remove();
}

function exportSupplierMail(sup, items) {
  const body = items.map(it => `- ${it.ing.name}: ${it.units} × ${it.ing.purchase_size||''} ${it.ing.purchase_unit||''}`).join('\n');
  location.href = `mailto:?subject=Order ${sup}&body=${encodeURIComponent('Hi,\n\nWe would like to order:\n\n' + body + '\n\nBest regards')}`;
}

function renderGuestShift(v) {
  // Kun aktive menuer i aktive grupper er gæstevendte
  const activeGroupIds = new Set(
    state.data.menu_groups.filter(g => g.is_active !== false).map(g => g.id)
  );
  const visibleMenus = allMenus(true).filter(m => !m.group_id || activeGroupIds.has(m.group_id));

  // Faneblade på øverste niveau: grupper + menuer uden gruppe
  const entries = [];
  visibleMenus.filter(m => !m.group_id)
    .forEach(m => entries.push({ key:'m:'+m.id, name:m.name, menus:[m] }));
  state.data.menu_groups
    .filter(g => g.is_active !== false)
    .forEach(g => {
      const ms = visibleMenus.filter(m => m.group_id === g.id);
      if (ms.length) entries.push({ key:'g:'+g.id, name:g.name, menus:ms });
    });

  // Fastlæg valget
  let entry = entries.find(e => e.key === state.svcGroupId) || entries[0] || null;
  if (entry) state.svcGroupId = entry.key;
  let menu = entry ? (entry.menus.find(m => m.id === state.svcMenuId) || entry.menus[0]) : null;
  if (menu) state.svcMenuId = menu.id;

  // Hvilke cocktails vises
  let actives;
  if (menu) {
    const byId = new Map(state.data.cocktails.map(c => [c.id, c]));
    actives = cocktailIdsOnMenu(menu.id).map(id => byId.get(id))
      .filter(c => c && c.is_active);
  } else {
    // Ingen menuer oprettet endnu — vis alt aktivt som hidtil
    actives = normalCocktails().filter(c => c.is_active);
  }

  v.appendChild(el('div',{class:'section-hd'},
    el('h1',{}, 'Service'),
    el('div',{class:'rule'}),
    el('div',{class:'sub'}, menu
      ? `${menuLabel(menu)} — ${actives.length} cocktails`
      : `${actives.length} cocktails on the menu`),
  ));

  // Gruppe-faner (skjules hvis der kun er én)
  if (entries.length > 1) {
    const tabs = el('div',{class:'no-print',style:{display:'flex',gap:'6px',flexWrap:'wrap',marginBottom:'8px'}});
    entries.forEach(e => {
      tabs.appendChild(el('button',{
        class: e.key === state.svcGroupId ? 'btn sm' : 'btn ghost sm',
        onclick: () => { state.svcGroupId = e.key; state.svcMenuId = null; renderRoute(); }
      }, e.name));
    });
    v.appendChild(tabs);
  }

  // Menu-faner inde i gruppen (skjules hvis gruppen kun har én menu)
  if (entry && entry.menus.length > 1) {
    const mtabs = el('div',{class:'no-print',style:{display:'flex',gap:'6px',flexWrap:'wrap',marginBottom:'10px'}});
    entry.menus.forEach(m => {
      mtabs.appendChild(el('button',{
        class: m.id === state.svcMenuId ? 'btn sm' : 'btn ghost sm',
        onclick: () => { state.svcMenuId = m.id; renderRoute(); }
      }, m.name));
    });
    v.appendChild(mtabs);
  }

  v.appendChild(el('div',{class:'btn-row no-print',style:{marginBottom:'14px'}},
    el('button',{class:'btn',onclick:()=>window.print()},'🖨 Print A4'),
  ));

  if (actives.length === 0) {
    v.appendChild(el('div',{class:'empty'},
      el('div',{class:'big'}, 'No cocktails on this menu'),
      el('div',{}, 'Add cocktails to it from the cocktail editor.'),
    ));
    return;
  }

  actives.forEach(c => {
    const card = el('div',{class:'gs-cocktail'});
    card.appendChild(el('h3',{}, c.name));
    if (c.menu_wording) card.appendChild(el('div',{class:'gs-menu'}, c.menu_wording));
    if (c.flavour_profile) card.appendChild(el('div',{class:'gs-flavour'}, c.flavour_profile));
    const grid = el('div',{class:'gs-grid'});
    const fields = [['Glass',c.glassware],['Ice',c.ice],['Garnish',c.garnish],['Tools',c.tools]];
    fields.forEach(([k,vv]) => { if (vv) grid.appendChild(el('div',{}, el('b',{},k), vv)); });
    card.appendChild(grid);
    if (c.procedure) card.appendChild(el('div',{style:{fontSize:'12px',color:'var(--ink-soft)',marginTop:'10px'}}, c.procedure));
    if (c.allergens) card.appendChild(el('div',{class:'gs-allerg'}, c.allergens));
    v.appendChild(card);
  });
}

async function openEventEditor(ev) {
  const isNew = !ev;
  const f = ev ? { ...ev } : { name:'', event_date:'', customer:'', guest_count:null, notes:'', is_active:true };
  const form = el('div');

  const mk = (label, key, type='text') => {
    const inp = el(type==='textarea'?'textarea':'input',
      { class:'input', value: f[key] ?? '', ...(type!=='textarea'?{type}:{}),
        oninput: e => f[key] = type==='number' ? (e.target.value===''?null:Number(e.target.value)) : e.target.value });
    form.appendChild(el('div',{class:'field'}, el('label',{},label), inp));
  };
  mk('Event name','name');
  mk('Date','event_date','date');
  mk('Customer','customer');
  mk('Guests','guest_count','number');
  mk('Notes','notes','textarea');

  const chk = el('input',{type:'checkbox',style:{marginRight:'6px'}});
  chk.checked = f.is_active !== false;
  chk.addEventListener('change',()=>f.is_active=chk.checked);
  form.appendChild(el('div',{class:'field'},
    el('label',{style:{display:'flex',alignItems:'center',gap:'6px',cursor:'pointer'}}, chk, 'Active'),
    el('div',{class:'sb',style:{marginTop:'4px'}},'Archived events stay in the list, marked ARCHIVED.'),
  ));

  if (!isNew) {
    const n = state.data.event_cocktails.filter(x => x.event_id === ev.id).length;
    form.appendChild(el('div',{style:{marginTop:'16px',borderTop:'1px solid var(--line)',paddingTop:'12px'}},
      el('div',{class:'sb',style:{marginBottom:'6px'}},
        'Deleting removes the event and its own cocktail and prep copies. Your library is untouched.'),
      el('button',{class:'btn ghost sm',style:{color:'var(--bad,#a33)'},onclick:async()=>{
        if (!confirm(`Delete "${ev.name}" with its ${n} cocktail(s)? This cannot be undone.`)) return;
        const { error } = await state.sb.from('events').delete().eq('id', ev.id);
        if (error) return toast(error.message,'bad');
        state.data.events = state.data.events.filter(x => x.id !== ev.id);
        state.data.event_cocktails = state.data.event_cocktails.filter(x => x.event_id !== ev.id);
        state.data.event_prep_resp = state.data.event_prep_resp.filter(x => x.event_id !== ev.id);
        state.data.cocktails = state.data.cocktails.filter(c => c.event_id !== ev.id);
        state.data.preps     = state.data.preps.filter(p => p.event_id !== ev.id);
        closeModal(); toast('Event deleted','ok'); location.hash = '#events';
      }},'Delete event'),
    ));
  }

  await modal(isNew ? 'New event' : 'Edit event', form, async () => {
    if (!f.name.trim()) return toast('Name required','bad');
    const payload = { tenant_id: state.activeTenantId, name: f.name.trim(),
      event_date: f.event_date || null, customer: f.customer || null,
      guest_count: f.guest_count ?? null, notes: f.notes || null,
      is_active: f.is_active !== false };
    if (isNew) {
      const { data, error } = await state.sb.from('events').insert(payload).select().single();
      if (error) return toast(error.message,'bad');
      state.data.events.unshift(data);
      toast('Event created','ok');
      closeModal(); location.hash = '#event/' + data.id;
      return true;
    }
    const { error } = await state.sb.from('events').update(payload).eq('id', ev.id);
    if (error) return toast(error.message,'bad');
    Object.assign(ev, payload);
    toast('Saved','ok'); renderRoute(); return true;
  });
}

  v.appendChild(listCard('Bar — ingredients',

    sortEntries(bar.ingredients, ingName), 'Nothing to buy.'));

  v.appendChild(listCard('Bar — preps to make', null,
    sortEntries(bar.preps, prepName), 'No preps for the bar.'));

  v.appendChild(listCard('Event host — preps to deliver', null,
    sortEntries(host.preps, prepName), 'The host delivers nothing.'));

  if (host.ingredients.size) {
    v.appendChild(listCard('Event host — ingredients',
      'What the host needs in order to make the preps above.',
      sortEntries(host.ingredients, ingName), ''));
  }

  // Tools — fritekst pr. cocktail, kan ikke lægges sammen
  if (bar.tools.length) {
    const tc = el('div',{class:'card',style:{marginTop:'16px'}});
    tc.appendChild(el('div',{class:'card-hd'}, el('h2',{},'Tools')));
    tc.appendChild(el('div',{class:'sb',style:{padding:'0 12px 8px'}},
      'Listed per cocktail — tools are free text and cannot be combined into one list.'));
    bar.tools.forEach(t => tc.appendChild(el('div',{class:'row'},
      el('div',{class:'grow'}, t.cocktail), el('div',{class:'right',style:{fontSize:'12px'}}, t.tools))));
    v.appendChild(tc);
  }

  // Prep-beskrivelser til værten
  if (host.preps.size) {
    const pc = el('div',{class:'card',style:{marginTop:'16px'}});
    pc.appendChild(el('div',{class:'card-hd'}, el('h2',{},'Prep instructions for the host')));
    [...host.preps.entries()].forEach(([pid, o]) => {
      const p = state.data.preps.find(x => x.id === pid);
      if (!p) return;
      const b = el('div',{style:{padding:'12px',borderTop:'1px solid var(--line)'}});
      b.appendChild(el('div',{style:{fontWeight:700,marginBottom:'2px'}},
        `${p.name} — ${num(o.qty,1)} ${o.unit || ''}`));
      b.appendChild(el('div',{class:'sb'}, `Recipe yields ${num(p.yield_quantity)} ${p.yield_unit || ''}`));
      state.data.prep_components.filter(x => x.prep_id === pid).forEach(x => {
        const nm = x.ingredient_id ? ingName(x.ingredient_id) : prepName(x.child_prep_id);
        b.appendChild(el('div',{style:{fontSize:'12px',marginTop:'3px'}}, `· ${nm} — ${num(x.quantity)} ${x.unit||''}`));
      });
      if (p.procedure)  b.appendChild(el('div',{style:{fontSize:'12px',marginTop:'8px'}}, p.procedure));
      if (p.shelf_life) b.appendChild(el('div',{class:'sb',style:{marginTop:'6px'}}, 'Shelf life: ' + p.shelf_life));
      pc.appendChild(b);
    });
    v.appendChild(pc);
  }

  if (warnings.length) {
    v.appendChild(el('div',{class:'card',style:{marginTop:'16px'}},
      el('div',{class:'card-hd'}, el('h2',{},'Warnings')),
      ...[...new Set(warnings)].map(w => el('div',{class:'row'}, el('div',{class:'grow'}, w))),
    ));
  }

  v.appendChild(el('div',{class:'sb',style:{marginTop:'14px'}},
    'Quantities are summed without converting between units — grams and millilitres are added as plain numbers.'));
}

async function openEventCocktailPicker(ev) {
  const already = new Set(
    state.data.event_cocktails.filter(ec => ec.event_id === ev.id)
      .map(ec => state.data.cocktails.find(c => c.id === ec.cocktail_id)?.name)
      .filter(Boolean));
  const selected = new Set();
  const form = el('div');

  const q = el('input',{class:'input',placeholder:'Search cocktail…',oninput:()=>renderList()});
  form.appendChild(el('div',{class:'field'}, q));
  form.appendChild(el('div',{class:'sb',style:{marginBottom:'8px'}},
    'Each cocktail is copied into the event. Editing the copy never changes your library.'));

  const list = el('div',{style:{maxHeight:'46vh',overflowY:'auto',borderTop:'1px solid var(--line)'}});
  form.appendChild(list);

  function renderList() {
    const term = q.value.toLowerCase().trim();
    list.innerHTML = '';
    const rows = normalCocktails().filter(c => !term ||
      (c.name||'').toLowerCase().includes(term) ||
      (c.menu_wording||'').toLowerCase().includes(term));
    if (!rows.length) { list.appendChild(el('div',{class:'sb',style:{padding:'12px 2px'}},'No matches.')); return; }
    rows.forEach(c => {
      const chk = el('input',{type:'checkbox',style:{marginRight:'8px',flexShrink:0}});
      chk.checked = selected.has(c.id);
      chk.addEventListener('change',()=> chk.checked ? selected.add(c.id) : selected.delete(c.id));
      list.appendChild(el('label',{style:{display:'flex',alignItems:'flex-start',gap:'4px',
        cursor:'pointer',padding:'8px 2px',borderBottom:'1px solid var(--line)'}},
        chk,
        el('div',{},
          el('div',{style:{fontWeight:600,fontSize:'13px'}}, c.name,
            already.has(c.name) ? el('span',{class:'chip s',style:{marginLeft:'6px'}},'already added') : null),
          c.menu_wording ? el('div',{class:'sb'}, c.menu_wording) : null,
        ),
      ));
    });
  }
  renderList();

  await modal('Add cocktails to ' + ev.name, form, async () => {
    if (!selected.size) return toast('Nothing selected','bad');
    let n = 0;
    for (const cid of selected) {
      const src = state.data.cocktails.find(c => c.id === cid);
      if (!src) continue;
      const copy = { ...src };
      delete copy.id; delete copy.created_at;
      copy.event_id = ev.id;
      copy.tenant_id = state.activeTenantId;
      const { data: nc, error } = await state.sb.from('cocktails').insert(copy).select().single();
      if (error) { toast(`${src.name}: ${error.message}`,'bad'); continue; }
      state.data.cocktails.push(nc);

      const comps = state.data.cocktail_components.filter(x => x.cocktail_id === src.id)
        .map(x => ({ tenant_id: state.activeTenantId, cocktail_id: nc.id,
          ingredient_id: x.ingredient_id, prep_id: x.prep_id, quantity: x.quantity, unit: x.unit }));
      if (comps.length) {
        const { data: cd, error: ce } = await state.sb.from('cocktail_components').insert(comps).select();
        if (ce) toast('Components: ' + ce.message,'bad');
        else state.data.cocktail_components.push(...(cd || []));
      }

      const { data: ecd, error: ee } = await state.sb.from('event_cocktails')
        .insert({ tenant_id: state.activeTenantId, event_id: ev.id, cocktail_id: nc.id, quantity: 0, sort_order: n })
        .select().single();
      if (ee) toast(ee.message,'bad'); else state.data.event_cocktails.push(ecd);
      n++;
    }
    toast(`${n} cocktail(s) copied in`,'ok');
    renderRoute();
    return true;
  });
}

// Holdt adskilt fra arbejdsarket med vilje. Arbejdsarket viser kostpris og
// margin; det må ikke havne hos en kunde eller en eventvært.

function eventPrintHeader(v, ev, title, subtitle) {
  const meta = [ev.event_date, ev.customer, ev.guest_count ? ev.guest_count + ' guests' : null]
    .filter(Boolean).join(' · ');
  v.appendChild(el('div',{class:'btn-row no-print',style:{marginBottom:'14px'}},
    el('button',{class:'btn ghost sm',onclick:()=>location.hash='#event/'+ev.id},'← Back to event'),
    el('button',{class:'btn',onclick:()=>window.print()},'🖨 Print / Save as PDF'),
  ));
  v.appendChild(el('div',{class:'section-hd'},
    el('h1',{}, ev.name),
    el('div',{class:'rule'}),
    el('div',{class:'sub'}, meta || ''),
  ));
  v.appendChild(el('div',{style:{fontSize:'11px',textTransform:'uppercase',letterSpacing:'.08em',
    color:'var(--ink-mute)',fontWeight:600,marginBottom:'12px'}}, title));
  if (subtitle) v.appendChild(el('div',{class:'sb',style:{marginBottom:'14px'}}, subtitle));
}

function renderEventMenu(v, id) {
  const ev = eventById(id);
  if (!ev) { v.appendChild(el('div',{class:'empty'},'Event not found.')); return; }
  eventPrintHeader(v, ev, 'Cocktail menu', null);

  const rows = state.data.event_cocktails
    .filter(ec => ec.event_id === id)
    .sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));

  if (!rows.length) {
    v.appendChild(el('div',{class:'empty'},'No cocktails on this event yet.'));
    return;
  }

  rows.forEach(ec => {
    const c = state.data.cocktails.find(x => x.id === ec.cocktail_id);
    if (!c) return;
    const card = el('div',{class:'gs-cocktail'});
    card.appendChild(el('h3',{}, c.name));
    if (c.menu_wording)    card.appendChild(el('div',{class:'gs-menu'}, c.menu_wording));
    if (c.flavour_profile) card.appendChild(el('div',{class:'gs-flavour'}, c.flavour_profile));
    const grid = el('div',{class:'gs-grid'});
    [['Glass',c.glassware],['Ice',c.ice],['Garnish',c.garnish]].forEach(([k,val]) => {
      if (val) grid.appendChild(el('div',{}, el('b',{},k), val));
    });
    card.appendChild(grid);
    if (c.allergens) card.appendChild(el('div',{class:'gs-allerg'}, c.allergens));
    v.appendChild(card);
  });
}

function renderEventHostDoc(v, id) {
  const ev = eventById(id);
  if (!ev) { v.appendChild(el('div',{class:'empty'},'Event not found.')); return; }
  eventPrintHeader(v, ev, 'Preparation for the event host',
    'Everything below is what you bring. The bar handles the rest.');

  const { host } = computeEventLists(id);
  const ingName = i => state.data.ingredients.find(x => x.id === i)?.name || '(unknown)';
  const prepName = i => state.data.preps.find(x => x.id === i)?.name || '(unknown)';

  if (!host.preps.size) {
    v.appendChild(el('div',{class:'empty'},
      el('div',{class:'big'},'Nothing assigned'),
      el('div',{},'No preps are marked as the host\u2019s responsibility.'),
    ));
    return;
  }

  // Indkøbsliste
  if (host.ingredients.size) {
    const c = el('div',{class:'card'});
    c.appendChild(el('div',{class:'card-hd'}, el('h2',{},'Shopping list')));
    [...host.ingredients.entries()]
      .map(([k,o]) => [ingName(k), `${num(o.qty,1)} ${o.unit||''}${o.mixedUnits?' ⚠':''}`])
      .sort((a,b)=>a[0].localeCompare(b[0]))
      .forEach(([n,q]) => c.appendChild(el('div',{class:'row'},
        el('div',{class:'grow'}, n), el('div',{class:'right',style:{fontWeight:600}}, q))));
    v.appendChild(c);
  }

  // Opskrifter
  [...host.preps.entries()].forEach(([pid, o]) => {
    const p = state.data.preps.find(x => x.id === pid);
    if (!p) return;
    const card = el('div',{class:'gs-cocktail'});
    card.appendChild(el('h3',{}, p.name));
    card.appendChild(el('div',{class:'gs-menu'},
      `Make ${num(o.qty,1)} ${o.unit || ''} — the recipe below yields ${num(p.yield_quantity)} ${p.yield_unit || ''}`));
    state.data.prep_components.filter(x => x.prep_id === pid).forEach(x => {
      const nm = x.ingredient_id ? ingName(x.ingredient_id) : prepName(x.child_prep_id);
      card.appendChild(el('div',{style:{fontSize:'12px',marginTop:'3px'}},
        `· ${nm} — ${num(x.quantity)} ${x.unit||''}`));
    });
    if (p.procedure)  card.appendChild(el('div',{style:{fontSize:'12px',marginTop:'10px'}}, p.procedure));
    if (p.shelf_life) card.appendChild(el('div',{class:'gs-allerg'}, 'Shelf life: ' + p.shelf_life));
    v.appendChild(card);
  });

  v.appendChild(el('div',{class:'sb',style:{marginTop:'14px'}},
    'Quantities are scaled from the recipes and not converted between units.'));
}

function renderMenus(v) {
  if (currentRole() !== 'admin') {
    v.appendChild(el('div',{class:'empty'}, 'Admins only.'));
    return;
  }

  v.appendChild(el('div',{class:'section-hd'},
    el('h1',{}, 'Menus'),
    el('div',{class:'rule'}),
    el('div',{class:'sub'}, `${state.data.menu_groups.length} groups · ${state.data.menus.length} menus`),
  ));

  v.appendChild(el('div',{class:'btn-row',style:{marginBottom:'14px'}},
    el('button',{class:'btn',onclick:()=>openGroupEditor(null)},'+ New group'),
    el('button',{class:'btn ghost',onclick:()=>openMenuEditor(null)},'+ New menu'),
  ));

  const menuRow = (m) => {
    const count = cocktailIdsOnMenu(m.id).length;
    return el('div',{class:'row click',onclick:()=>openMenuEditor(m)},
      el('div',{class:'grow'},
        el('div',{class:'ttl'}, m.name,
          m.is_active === false ? el('span',{class:'chip warn',style:{marginLeft:'6px'}},'INACTIVE') : null),
        el('div',{class:'sb'}, count === 1 ? '1 cocktail' : `${count} cocktails`),
      ),
      el('div',{class:'right',style:{display:'flex',gap:'6px',alignItems:'center'}},
        el('button',{class:'btn sm',onclick:e=>{ e.stopPropagation(); openMenuCocktailPicker(m); }},'Cocktails'),
        el('span',{class:'chip s'},'Edit'),
      ),
    );
  };

  // Menuer uden gruppe
  const solo = ungroupedMenus();
  if (solo.length) {
    v.appendChild(el('div',{style:{fontSize:'11px',textTransform:'uppercase',letterSpacing:'.08em',color:'var(--ink-mute)',fontWeight:600,margin:'12px 0 6px'}}, 'No group'));
    const card = el('div',{class:'card'});
    solo.forEach(m => card.appendChild(menuRow(m)));
    v.appendChild(card);
  }

  // Grupper
  state.data.menu_groups.forEach(g => {
    const hd = el('div',{style:{display:'flex',alignItems:'center',gap:'8px',margin:'16px 0 6px'}},
      el('div',{style:{fontSize:'11px',textTransform:'uppercase',letterSpacing:'.08em',color:'var(--ink-mute)',fontWeight:600}}, g.name),
      g.is_active === false ? el('span',{class:'chip warn'},'INACTIVE') : null,
      el('button',{class:'btn ghost sm',onclick:()=>openGroupEditor(g)},'Edit group'),
    );
    v.appendChild(hd);
    const ms = menusInGroup(g.id);
    if (!ms.length) {
      v.appendChild(el('div',{class:'sb',style:{paddingLeft:'2px',marginBottom:'4px'}}, 'No menus in this group yet.'));
      return;
    }
    const card = el('div',{class:'card'});
    ms.forEach(m => card.appendChild(menuRow(m)));
    v.appendChild(card);
  });

  if (!state.data.menus.length && !state.data.menu_groups.length) {
    v.appendChild(el('div',{class:'empty'},
      el('div',{class:'big'},'No menus yet'),
      el('div',{},'Create a menu to start organising your cocktails.'),
    ));
  }
}

async function openGroupEditor(group) {
  const isNew = !group;
  const f = group ? { ...group } : { name:'', sort_order:0, is_active:true };
  const form = el('div');

  const nameInp = el('input',{class:'input',value:f.name,oninput:e=>f.name=e.target.value});
  form.appendChild(el('div',{class:'field'}, el('label',{},'Group name'), nameInp));

  const sortInp = el('input',{class:'input',type:'number',value:f.sort_order ?? 0,
    oninput:e=>f.sort_order = e.target.value===''?0:Number(e.target.value)});
  form.appendChild(el('div',{class:'field'}, el('label',{},'Sort order'), sortInp));

  const chk = el('input',{type:'checkbox',style:{marginRight:'6px'}});
  chk.checked = f.is_active !== false;
  chk.addEventListener('change',()=>f.is_active = chk.checked);
  form.appendChild(el('div',{class:'field'},
    el('label',{style:{display:'flex',alignItems:'center',gap:'6px',cursor:'pointer'}}, chk, 'Active'),
    el('div',{class:'sb',style:{marginTop:'4px'}},'Inactive groups are hidden from the Service page.'),
  ));

  if (!isNew) {
    form.appendChild(el('div',{style:{marginTop:'16px',borderTop:'1px solid var(--line)',paddingTop:'12px'}},
      el('button',{class:'btn ghost sm',style:{color:'var(--bad,#a33)'},onclick:async()=>{
        if (!confirm(`Delete the group "${group.name}"?`)) return;
        const { error } = await state.sb.from('menu_groups').delete().eq('id', group.id);
        if (error) return toast('Move or delete its menus first','bad');
        state.data.menu_groups = state.data.menu_groups.filter(x => x.id !== group.id);
        closeModal(); toast('Group deleted','ok'); renderRoute();
      }},'Delete group'),
    ));
  }

  await modal(isNew ? 'New group' : 'Edit group', form, async () => {
    if (!f.name.trim()) return toast('Name required','bad');
    const payload = { tenant_id: state.activeTenantId, name: f.name.trim(),
      sort_order: f.sort_order ?? 0, is_active: f.is_active !== false };
    if (isNew) {
      const { data, error } = await state.sb.from('menu_groups').insert(payload).select().single();
      if (error) return toast(error.message,'bad');
      state.data.menu_groups.push(data);
    } else {
      const { error } = await state.sb.from('menu_groups').update(payload).eq('id', group.id);
      if (error) return toast(error.message,'bad');
      Object.assign(group, payload);
    }
    state.data.menu_groups.sort((a,b)=>(a.sort_order||0)-(b.sort_order||0) || a.name.localeCompare(b.name));
    toast('Saved','ok'); renderRoute(); return true;
  });
}

    state.data.menus.sort((a,b)=>(a.sort_order||0)-(b.sort_order||0) || a.name.localeCompare(b.name));
    toast('Saved','ok'); renderRoute(); return true;

async function openMenuCocktailPicker(menu) {
  const selected = new Set(cocktailIdsOnMenu(menu.id));
  const form = el('div');

  const counter = el('div',{class:'sb',style:{marginBottom:'8px'}});
  const updateCounter = () => {
    counter.textContent = `${selected.size} of ${normalCocktails().length} cocktails selected`;
  };

  const q = el('input',{class:'input',placeholder:'Search cocktail…',oninput:()=>renderList()});
  form.appendChild(el('div',{class:'field'}, q));
  form.appendChild(counter);

  form.appendChild(el('div',{class:'btn-row',style:{marginBottom:'10px'}},
    el('button',{class:'btn ghost sm',onclick:()=>{ shown().forEach(c=>selected.add(c.id)); renderList(); }},'Select all shown'),
    el('button',{class:'btn ghost sm',onclick:()=>{ selected.clear(); renderList(); }},'Clear all'),
  ));

  const list = el('div',{style:{maxHeight:'46vh',overflowY:'auto',borderTop:'1px solid var(--line)'}});
  form.appendChild(list);

  function shown() {
    const term = q.value.toLowerCase().trim();
    if (!term) return normalCocktails();
    return normalCocktails().filter(c =>
      (c.name||'').toLowerCase().includes(term) ||
      (c.menu_wording||'').toLowerCase().includes(term));
  }

  function renderList() {
    updateCounter();
    list.innerHTML = '';
    const rows = shown();
    if (!rows.length) {
      list.appendChild(el('div',{class:'sb',style:{padding:'12px 2px'}},'No cocktails match.'));
      return;
    }
    rows.forEach(c => {
      const chk = el('input',{type:'checkbox',style:{marginRight:'8px',flexShrink:0}});
      chk.checked = selected.has(c.id);
      chk.addEventListener('change',()=>{
        chk.checked ? selected.add(c.id) : selected.delete(c.id);
        updateCounter();
      });
      list.appendChild(el('label',{style:{display:'flex',alignItems:'flex-start',gap:'4px',
        cursor:'pointer',padding:'8px 2px',borderBottom:'1px solid var(--line)'}},
        chk,
        el('div',{},
          el('div',{style:{fontWeight:600,fontSize:'13px'}}, c.name,
            c.is_active === false ? el('span',{class:'chip warn',style:{marginLeft:'6px'}},'INACTIVE') : null),
          c.menu_wording ? el('div',{class:'sb'}, c.menu_wording) : null,
        ),
      ));
    });
  }
  renderList();

  await modal('Cocktails on: ' + menu.name, form, async () => {
    const { error: delErr } = await state.sb.from('menu_cocktails').delete().eq('menu_id', menu.id);
    if (delErr) return toast(delErr.message,'bad');
    state.data.menu_cocktails = state.data.menu_cocktails.filter(mc => mc.menu_id !== menu.id);

    const ordered = normalCocktails().filter(c => selected.has(c.id));
    const rows = ordered.map((c,i) => ({
      tenant_id: state.activeTenantId, menu_id: menu.id, cocktail_id: c.id, sort_order: i,
    }));
    if (rows.length) {
      const { data, error } = await state.sb.from('menu_cocktails').insert(rows).select();
      if (error) return toast(error.message,'bad');
      state.data.menu_cocktails.push(...(data || []));
    }
    toast(`${rows.length} cocktails on ${menu.name}`,'ok');
    renderRoute();
    return true;
  });
}
